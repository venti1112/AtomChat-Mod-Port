plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

// 共享层装配：读仓库级身份 + 把 shared/ 与本目标挂载的层接进源集。
// 判定依据在 versions/*.json，本平台不做任何目标名硬编码。
apply from: '../../gradle/atomchat-native-platform.gradle'
apply from: '../../gradle/atomchat-layers.gradle'

// 增量装配：本目录只放 1.21.8 的差异补丁，源码树在构建期从 overlay_base
// （versions/targets.json）复制出来再应用 patches/*.patch。
apply from: '../../gradle/atomchat-overlay.gradle'

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Yarn 的 build 号按 Minecraft 版本走，不能从基础平台继承。
    mappings "net.fabricmc:yarn:1.21.8+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Keep Java bindings and the selected native at the same exact version.
    include(implementation("io.github.humbleui:skija-shared:${project.skija_version}"))
    include(implementation("io.github.humbleui:types:0.2.0"))
    // Bundle only the selected operating system native; never both.
    include(implementation("io.github.humbleui:${project.atomchatNativeArtifact}:${project.skija_version}"))

    // FlatLaf gives the Swing image picker a modern flat look instead of the
    // dated default Metal one. Bundled as a RELOCATED copy (private package, see
    // third_party/ and gradle/atomchat-layers.gradle): another mod shipping
    // com.formdev.flatlaf.* used to win the class loading race, and our picker
    // then ran on that copy. Regenerate with tools/relocate-flatlaf.sh.
    include(implementation(project.atomchatBundledFlatLaf))

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 no longer injects the launcher; tests fail to start without it.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Cross-build tests use the host JVM's native; test dependencies are not bundled.
    testImplementation "io.github.humbleui:${project.atomchatTestNativeArtifact}:${project.skija_version}"
}

tasks.named('remapJar') {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}${project.atomchatNativeSuffix}.jar"
}

// depends.minecraft 的谓词由 targets.json 的 minecraft + minecraft_until 生成：
// 版本范围只声明一次，补丁不再手抄这一行。
def mcRange = project.ext.atomchatMinecraftRange
if (!mcRange) {
    throw new GradleException(
        "versions/targets.json 里 ${project.ext.atomchatTargetName} 没有 minecraft_until —— " +
        "Fabric 目标的版本范围没有上界，fabric.mod.json 没法展开")
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version_range', mcRange
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version_range: mcRange
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces = true
        showCauses = true
    }
}

// Plain JUnit does not launch Knot. Apply its named-package access repair before
// vanilla registry bootstrap; this agent is test-only and never enters mod JARs.
// 增量目标不复制 build.gradle，这段需要与基础平台手动保持一致。
def fabricTestAgent = tasks.register('fabricTestAgent', Jar) {
    dependsOn tasks.named('testClasses')
    from(sourceSets.test.output) { include 'com/atom/chat/testing/FabricPackageAccessAgent*.class' }
    archiveFileName = 'fabric-package-access-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('test-agent')
    manifest { attributes 'Premain-Class': 'com.atom.chat.testing.FabricPackageAccessAgent' }
}
tasks.named('test', Test) {
    dependsOn fabricTestAgent
    jvmArgs "-javaagent:${layout.buildDirectory.file('test-agent/fabric-package-access-agent.jar').get().asFile}"
}

loom {
    // AW 不随增量补丁走，直接读基础平台那一份：生成树在配置期还不存在，
    // 指向生成路径会让 Loom 在配置阶段就报找不到文件。
    accessWidenerPath = new File(atomchatOverlayBaseDir, 'src/main/resources/atomchat.accesswidener')
}

// ---------------------------------------------------------------------------
// Release publishing (Modrinth + CurseForge)
//
// Tokens come from the environment only — never commit them. The publishing
// tasks are skipped when the matching token is absent, so everyday builds and
// tests run without any store credentials. Project IDs live in
// gradle.properties (modrinth_project_id / curseforge_project_id).
// ---------------------------------------------------------------------------

// Store-facing version label, following the jar naming habit:
// Fabric-<mc_version>-<mod_version>, e.g. Fabric-1.21.8-0.4.0-preview
def storeVersion = "Fabric-${project.atomchatMinecraftVersions.join(',')}-${project.mod_version}${project.atomchatNativeSuffix}"

def changelogFor(version) {
    def text = new File(atomchatRepoRoot, 'RELEASE_NOTES.md').getText('UTF-8')
    // A prerelease suffix (0.4.0-preview) shares the base version's section —
    // the suffix is not a version difference (skill changelog-format, rule 1).
    def base = version.split('-')[0]
    def start = text.indexOf("## v${base}")
    if (start < 0) {
        return "AtomChat ${version}"
    }
    def end = text.indexOf('\n## ', start + 1)
    def section = end > start ? text.substring(start, end) : text.substring(start)
    def trimmed = section.trim()
    // Store changelog = 分隔线 `----` **之后**的英文块（格式与写法见 skill `changelog-format`）。
    // 用 `-{3,}` 而不是写死三个/四个横线：本仓库历史上两种都写过。
    def sep = trimmed =~ /(?m)^-{3,}$/
    return sep.find() ? trimmed.substring(sep.end()).trim() : trimmed
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = project.modrinth_project_id
    versionNumber = storeVersion
    versionType = "release"
    uploadFile = remapJar
    gameVersions = project.atomchatMinecraftVersions
    loaders = ["fabric"]
    changelog = changelogFor(project.version)

    dependencies {
        required.project "fabric-api"
    }
}

tasks.named('modrinth') {
    onlyIf { System.getenv("MODRINTH_TOKEN") }
}

def cfProjectId = (project.findProperty('curseforge_project_id') ?: '').toString()
def cfConfigured = cfProjectId ==~ /\d+/

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN") ?: ""
    onlyIf { cfConfigured && System.getenv("CURSEFORGE_TOKEN") }

    if (cfConfigured) {
        def main = upload(cfProjectId as int, remapJar)
        main.changelogType = 'markdown'
        main.changelog = changelogFor(project.version)
        main.releaseType = 'release'
        main.displayName = storeVersion
        project.atomchatMinecraftVersions.each { main.addGameVersion it }
        main.addModLoader 'Fabric'
        main.addJavaVersion 'Java 21'
        // CurseForge rejects uploads without an environment tag (error 1021).
        main.addEnvironment 'Client', 'Server'
        main.addRequirement 'fabric-api'
    }
}

tasks.register('publishMods') {
    group = 'publishing'
    description = 'Publish the mod to Modrinth and CurseForge.'
    dependsOn 'modrinth', 'curseforge'
}
