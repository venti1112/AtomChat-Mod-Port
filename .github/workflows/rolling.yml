name: Rolling Build

# 滚动测试版：只手动触发。有提交才发，没提交就不发。
#
# 每次构建前把根目录 gradle.properties 的 mod_version 临时改成
#   <基础版本>-rolling-YYYYMMDDHHMM（Asia/Shanghai）
# 构建完成后整体替换 GitHub Releases 上的固定标签 rolling：
# 先删旧 Release + 旧 Tag，再建新的 Pre-release —— 不保留历史版本。
#
# 版本号注入用 git update-index --assume-unchanged 让 git 忽略这处改动，
# 这样构建戳里的 git_dirty 保持 false、SHA 仍指向真正触发构建的提交，
# 而不是一个只存在于 CI 里的临时提交。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  targets:
    name: 校验矩阵
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.matrix.outputs.list }}
      version: ${{ steps.version.outputs.version }}
      built_at: ${{ steps.version.outputs.built_at }}
    steps:
      - uses: actions/checkout@v7

      # 所有 job 共用同一个时间戳，避免 build 与 release 跨分钟算出两个版本号。
      - name: 计算滚动版本号
        id: version
        run: |
          set -euo pipefail
          BASE="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          BASE="${BASE%%-rolling-*}"
          STAMP="$(TZ='Asia/Shanghai' date +%Y%m%d%H%M)"
          BUILT_AT="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "version=${BASE}-rolling-${STAMP}" >> "$GITHUB_OUTPUT"
          echo "built_at=${BUILT_AT}" >> "$GITHUB_OUTPUT"
          echo "滚动版本：${BASE}-rolling-${STAMP}（${BUILT_AT}）"

      - name: 校验 versions/ 与各平台的身份来源
        run: python3 tools/verify_targets.py --matrix-out "$RUNNER_TEMP/matrix.json"

      - name: 导出矩阵
        id: matrix
        run: echo "list=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v7

      - name: 注入滚动版本号
        run: |
          set -euo pipefail
          VERSION="${{ needs.targets.outputs.version }}"
          sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties
          grep '^mod_version=' gradle.properties
          # 版本号是注入的，源码仍来自当前提交。告诉 git 忽略这处改动，
          # 让构建戳的 git_dirty 保持 false、SHA 仍指向原提交。
          git update-index --assume-unchanged gradle.properties

      - name: 安装 Skija 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: 设置 JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: "${{ matrix.java }}"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 构建并测试
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
          ./gradlew build -x test -Patomchat.nativePlatform=linux-x64 --no-daemon
          ./gradlew build -x test -Patomchat.nativePlatform=windows-arm64 --no-daemon

      # 版本号是注入的，不是脏；这里仍然要断言，防止 assume-unchanged 之外的
      # 意外改动让发行 jar 带上 git_dirty=true。
      - name: 断言构建戳没说谎
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          while IFS= read -r jar; do
          echo "构建戳（$jar）："
          unzip -p "$jar" atomchat-build.properties
          if unzip -p "$jar" atomchat-build.properties | grep -q '^git_dirty=true'; then
            echo "::error::发行 jar 的构建戳写着 git_dirty=true，但版本号只是注入的，源码应来自干净 checkout"
            exit 1
          fi
          done < <(find build/libs build/linux-x64/libs build/windows-arm64/libs -name "*.jar" ! -name "*sources*" ! -name "*-slim*")

      - name: 断言产物内容
        run: |
          python3 tools/test_verify_jars.py
          python3 tools/verify_jars.py --platform windows-x64 "${{ matrix.project }}"
          python3 tools/verify_jars.py --platform linux-x64 "${{ matrix.project }}"
          python3 tools/verify_jars.py --platform windows-arm64 "${{ matrix.project }}"

      - name: 取产物（-slim 与 sources 一律不要）
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find build/libs build/linux-x64/libs build/windows-arm64/libs -name "*.jar" ! -name "*sources*" ! -name "*-slim*" \
            -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          ls -la "$GITHUB_WORKSPACE/dist"
          count=$(find "$GITHUB_WORKSPACE/dist" -name "*.jar" | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error::期望恰好 Windows x64 / Windows ARM64 / Linux x64 三个发布 jar，实际 $count 个"
            exit 1
          fi
          if find "$GITHUB_WORKSPACE/dist" -name "*-slim*" | grep -q .; then
            echo "::error::取到的是 -slim 包（不含内嵌依赖）"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.target }}${{ matrix.suffix }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: 更新 rolling
    needs: [targets, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 取回发布 jar（未验证目标不进 Release）
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: 汇总并校验数量
        run: |
          set -euo pipefail
          mkdir -p release-out
          # buildable: false 的目标也参与构建（产物名带 -未验证），但不进 Release。
          find artifacts -name "*.jar" ! -name "*sources*" ! -name "*-slim*" \
            ! -path "*-未验证/*" -exec cp {} release-out/ \;
          ls -la release-out
          count=$(find release-out -name "*.jar" | wc -l)
          expected=$(python3 -c "import json; t=json.load(open('versions/targets.json', encoding='utf-8')); print(3*sum(1 for k,v in t.items() if not k.startswith('_') and v.get('buildable')))")
          echo "Release 将挂上 ${count} 个 jar（期望 ${expected} = 可发布目标 × 3 个系统/架构变体）"
          if [ "$count" -ne "$expected" ]; then
            echo "::error::期望 ${expected} 个发布 JAR，实际 ${count} 个"
            exit 1
          fi

      # 固定标签，每次整体替换：先删旧 Release（连带旧 Tag），
      # 再兜底删一次 Tag（防止 release 不存在但 tag 残留）。
      - name: 删除旧的 rolling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rolling --yes --cleanup-tag || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/rolling" || true

      - name: 建新的 rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          target_commitish: ${{ github.sha }}
          name: 滚动测试版 ${{ needs.targets.outputs.version }}
          body: |
            滚动测试版:

            - 版本号：`${{ needs.targets.outputs.version }}`
            - 构建时间：${{ needs.targets.outputs.built_at }}
            - 源码提交：`${{ github.sha }}`
          files: release-out/*.jar
          prerelease: true
          make_latest: 'false'